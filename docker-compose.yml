services:
  hf-pull:
    build:
      context: .
    container_name: feclustre-hf-pull
    environment:
      HF_HOME: /hf-cache
      TRANSFORMERS_CACHE: /hf-cache
    volumes:
      - hf_cache:/hf-cache
    command:
      - python
      - "-c"
      - |
        from transformers import AutoTokenizer, AutoModelForTokenClassification
        from sentence_transformers import SentenceTransformer
        print('Downloading T-FREX model...', flush=True)
        AutoTokenizer.from_pretrained('quim-motger/t-frex-bert-base-uncased')
        AutoModelForTokenClassification.from_pretrained('quim-motger/t-frex-bert-base-uncased')
        print('Downloading embedding model...', flush=True)
        SentenceTransformer('all-MiniLM-L6-v2')
        print('All models ready.', flush=True)
    restart: "no"

  app:
    build:
      context: .
    container_name: feclustre-api
    ports:
      - "3000:3000"
    environment:
      FLASK_DEBUG: "false"
      LOG_LEVEL: INFO
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
      NEO4J_DATABASE: neo4j
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen:1.8b}
      TRANSFEATEX_URL: ${TRANSFEATEX_URL:-}
      HF_HOME: /hf-cache
      TRANSFORMERS_CACHE: /hf-cache
    volumes:
      - hf_cache:/hf-cache
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      hf-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/ping', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15
    container_name: neo4j-feclust
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/12345678
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p 12345678 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-feclust
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-feclust-pull
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen:1.8b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  hf_cache:
